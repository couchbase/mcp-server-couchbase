[project]
name = "enterprise-analytics-streaming-mcp-server"
version = "0.1.0"
description = "MCP server for Couchbase Enterprise Analytics (row-streaming query API)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "click>=8.1.0",
    # Row streaming via execute_query().rows() is available in the analytics
    # SDK 1.1.0 line, which ships with self-managed Enterprise Analytics 2.2.
    "couchbase-analytics>=1.1.0",
]

[project.scripts]
enterprise-analytics-streaming-mcp-server = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_mcp", "src/providers"]
# mcp_server.py is a top-level module (the console-script entrypoint imports it
# as `mcp_server`). Ship it alongside the packages so it's importable after
# install, not just when running from inside src/.
force-include = { "src/mcp_server.py" = "mcp_server.py" }
