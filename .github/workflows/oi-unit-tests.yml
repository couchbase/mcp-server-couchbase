name: OI Unit Tests

# Runs tests/unit (no live cluster needed). Duplicates test.yml's unit-tests
# job so it also runs on PRs targeting multi_package, which test.yml (main
# only) doesn't cover.
on:
  pull_request:
    branches: [main, multi_package]

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: uv run pytest tests/unit -v --tb=short
