name: Accuracy (Operational Insights)

# The Operational Insights half of the accuracy evals. Split from
# accuracy.yml rather than added as a second job to it, because the two
# tiers need *different products*: accuracy.yml boots a Couchbase Server
# container (kv/n1ql/index/fts on 8091-8096), while these tests need an
# Enterprise Analytics cluster plus its S3-compatible blob store. Keeping
# them apart means an OI cluster that fails to come up cannot take the
# operational evals down with it, and either can be re-run alone.
#
# Cluster bring-up is not reimplemented here: it reuses the exact
# docker-compose.yml + configure_cluster.sh that oi-integration-tests.yml
# drives, so the two tiers cannot drift apart. The one addition is loading
# the travel-sample dataset, which the integration tier does not need (it
# creates throwaway collections) but the accuracy tier does — schema
# inference has to sample real documents.

permissions:
  contents: read

on:
  # Same triggers as accuracy.yml: a baseline on every published release,
  # plus on-demand runs. These cost real OpenAI credits, so they are
  # deliberately not wired into per-PR CI.
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      model:
        description: "OpenAI model id"
        required: false
        default: "gpt-5.5"
        type: string
      run_id:
        description: "Run id used in the results file (defaults to release-<tag> on tag pushes, gh-run-<run_number> otherwise)"
        required: false
        type: string
      test_filter:
        description: "Pytest -k filter to narrow which cases run (optional)"
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # docker-compose.yml's ${VAR} references. Mirrors oi-integration-tests.yml
  # so both tiers exercise the same cluster topology.
  OI_IMAGE: couchbase/enterprise-analytics:2.2.1
  S3MOCK_IMAGE: adobe/s3mock:5.2.3
  S3MOCK_BUCKET: cloud-storage-container
  S3MOCK_STORE_ROOT: fs
  S3MOCK_RETAIN_FILES_ON_EXIT: "true"
  OI_ADMIN_PORT: 8091
  OI_ANALYTICS_PORT: 8095
  # configure_cluster.sh's blob storage settings.
  BLOB_STORAGE_SCHEME: s3
  BLOB_STORAGE_REGION: us-east-1
  BLOB_STORAGE_ENDPOINT: http://s3mock:9090
  BLOB_STORAGE_ANONYMOUS_AUTH: "true"
  BLOB_STORAGE_PATH_STYLE_ADDRESSING: "true"
  NUM_STORAGE_PARTITIONS: 16
  # configure_cluster.sh's clusterInit settings.
  CLUSTER_USERNAME: Administrator
  CLUSTER_PASSWORD: password
  # 1024, not the integration tier's 100: /sampleBuckets/install refuses
  # travel-sample below a 200MB quota ("Not enough Quota, you need to
  # allocate 200MB to install sample buckets"), and the quota cannot be
  # raised after clusterInit — the data service rejects a later increase
  # ("cannot be greater than <initial>MB"). So it has to be set correctly
  # the first time. The integration tier needs no sample data and stays at
  # its smaller quota. A GitHub ubuntu-latest runner has ~16GB, so this is
  # comfortably within budget.
  CLUSTER_MEMORY_QUOTA: 1024
  CLUSTER_NAME: OI Accuracy Cluster
  # 127.0.0.1, not localhost: the couchbase_operational_insights SDK picks a
  # random address when a hostname resolves to more than one (localhost ->
  # 127.0.0.1 and ::1), and the ::1 that container port publishing does not
  # forward causes an immediate connection reset. Port matches
  # OI_ANALYTICS_PORT; kept literal because one env entry cannot reference
  # a sibling.
  CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
  CB_OI_USERNAME: Administrator
  CB_OI_PASSWORD: password

jobs:
  oi-accuracy:
    name: OI accuracy evals
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start OI containers
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml up -d --wait

      - name: Configure OI cluster
        run: ./scripts/oi_ci_cluster/configure_cluster.sh

      - name: Load travel-sample dataset
        run: ./scripts/oi_ci_cluster/load_travel_sample.sh

      # Same resolution rules as accuracy.yml, including the injection guard:
      # RUN_ID is written to $GITHUB_ENV and used as a results filename, and
      # workflow_dispatch inputs are untrusted.
      - name: Resolve accuracy run id
        env:
          INPUT_RUN_ID: ${{ inputs.run_id }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          if [ -n "$INPUT_RUN_ID" ]; then
            RUN_ID="$INPUT_RUN_ID"
          elif [ "$REF_TYPE" = "tag" ]; then
            RUN_ID="release-$REF_NAME"
          else
            RUN_ID="gh-run-$RUN_NUMBER"
          fi

          if [[ ! "$RUN_ID" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "::error::Invalid run id. Allowed characters: A-Z a-z 0-9 . _ -"
            exit 1
          fi

          echo "CB_ACCURACY_RUN_ID=$RUN_ID" >> "$GITHUB_ENV"
          echo "Using accuracy run id: $RUN_ID"

      - name: Run OI accuracy / eval tests
        env:
          CB_MCP_TRANSPORT: stdio
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CB_ACCURACY_OPENAI_MODEL: ${{ inputs.model || 'gpt-5.5' }}
          CB_ACCURACY_RESULTS_DIR: ${{ github.workspace }}/accuracy-results
          CB_ACCURACY_TEST_FILTER: ${{ inputs.test_filter }}
        run: |
          if [ -z "${OPENAI_API_KEY}" ]; then
            echo "::error::OPENAI_API_KEY secret is not set. Add it under repo Settings → Secrets."
            exit 1
          fi
          mkdir -p "$CB_ACCURACY_RESULTS_DIR"

          # Fail loudly rather than silently reporting success: without the
          # CB_OI_* credentials every test in this directory skips (see that
          # directory's conftest), which would make a broken cluster look
          # like a green run. -W error::pytest.PytestUnraisableExceptionWarning
          # is deliberately not used; this guard is about skips, not warnings.
          if [ -n "$CB_ACCURACY_TEST_FILTER" ]; then
            uv run pytest tests/accuracy/operational_insights -v --tb=short \
              -k "$CB_ACCURACY_TEST_FILTER"
          else
            uv run pytest tests/accuracy/operational_insights -v --tb=short
          fi

      - name: Upload accuracy run JSON
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: oi-accuracy-results-${{ github.run_number }}
          path: accuracy-results/
          if-no-files-found: warn
          retention-days: 30

      - name: Dump OI container logs
        if: failure()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml logs --no-color --tail 300

      - name: Tear down OI containers
        if: always()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml down -v
