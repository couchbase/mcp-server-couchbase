name: Update MCP Registry

on:
  workflow_run:
    workflows: ["Build and Push Docker Image"]
    types:
      - completed

jobs:
  gate:
    # Downloads the version artifact from Docker and checks if this is a version tag run.
    # workflow_run chains always execute on the default branch, so head_branch is always
    # "main" by this point — we use the artifact to recover the original tag name instead.
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    permissions:
      actions: read
    outputs:
      version: ${{ steps.read-version.outputs.version }}
      is-version-tag: ${{ steps.read-version.outputs.is-version-tag }}
    steps:
      - name: Download version artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: release-version
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Read and validate version tag
        id: read-version
        run: |
          VERSION=$(tr -d '\r\n' < version.txt)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "$VERSION" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+'; then
            echo "is-version-tag=true" >> "$GITHUB_OUTPUT"
          else
            echo "is-version-tag=false" >> "$GITHUB_OUTPUT"
          fi

  check-and-update-registry:
    needs: gate
    if: needs.gate.outputs.is-version-tag == 'true'

    runs-on: ubuntu-latest
    permissions:
      id-token: write # Required for GitHub OIDC authentication with MCP Registry
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ needs.gate.outputs.version }}

      - name: Validate version consistency
        id: version
        env:
          HEAD_BRANCH: ${{ needs.gate.outputs.version }}
        run: |
          # Read versions from files
          ROOT_VERSION=$(jq -r '.version' server.json)
          # Only get versions from packages that have a version field (exclude null/empty)
          PACKAGE_VERSIONS=$(jq -r '.packages[] | select(.version != null) | .version' server.json | sort -u)
          PYPROJECT_VERSION=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/')
          # Get tag from the triggering workflow (Docker), not current workflow
          # Use environment variable to prevent code injection
          TAG_VERSION=${HEAD_BRANCH#v}

          echo "Version Check:"
          echo "  server.json root:    $ROOT_VERSION"
          echo "  server.json packages:"
          jq -r '.packages[] |
            if .version != null then
              "     - \(.registryType):\(.identifier) = \(.version)"
            else
              "     - \(.registryType):\(.identifier) (no version field)"
            end' server.json
          echo "  pyproject.toml:      $PYPROJECT_VERSION"
          echo "  Git tag:             $TAG_VERSION"
          echo ""

          # Check if all package versions match root version (only for packages with version field)
          MISMATCH=false
          if [ -n "$PACKAGE_VERSIONS" ]; then
            while IFS= read -r pkg_ver; do
              if [ "$pkg_ver" != "$ROOT_VERSION" ]; then
                echo "ERROR: Package version ($pkg_ver) doesn't match root version ($ROOT_VERSION)"
                MISMATCH=true
              fi
            done <<< "$PACKAGE_VERSIONS"
          fi

          if [ "$MISMATCH" = true ]; then
            echo ""
            echo "Fix: Update server.json so all package versions match the root version"
            exit 1
          fi

          # Check if root version matches tag
          if [ "$ROOT_VERSION" != "$TAG_VERSION" ]; then
            echo "ERROR: server.json version ($ROOT_VERSION) doesn't match tag ($TAG_VERSION)"
            echo "Fix: Update server.json root version to match the tag"
            exit 1
          fi

          # Warn if pyproject.toml doesn't match
          if [ "$PYPROJECT_VERSION" != "$TAG_VERSION" ]; then
            echo "WARNING: pyproject.toml version ($PYPROJECT_VERSION) doesn't match tag ($TAG_VERSION)"
            echo "This may cause PyPI issues"
          fi

          # Check Docker image tags in OCI identifiers
          echo ""
          echo "Checking Docker image tags..."
          OCI_PACKAGES=$(jq -r '.packages[] | select(.registryType == "oci") | .identifier' server.json)
          if [ -n "$OCI_PACKAGES" ]; then
            OCI_TAG_MISMATCH=false
            while IFS= read -r oci_id; do
              # Extract tag from identifier (everything after last :)
              IMAGE_TAG="${oci_id##*:}"
              echo "  - Image: $oci_id"
              echo "    Tag: $IMAGE_TAG"

              if [ "$IMAGE_TAG" != "$ROOT_VERSION" ]; then
                echo "    ERROR: Docker image tag ($IMAGE_TAG) doesn't match version ($ROOT_VERSION)"
                OCI_TAG_MISMATCH=true
              else
                echo "    Tag matches"
              fi
            done <<< "$OCI_PACKAGES"

            if [ "$OCI_TAG_MISMATCH" = true ]; then
              echo ""
              echo "Fix: Update Docker image tags in server.json to match the version"
              exit 1
            fi
          fi

          echo ""
          echo "All version checks passed!"
          echo "version=$ROOT_VERSION" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Install MCP Publisher
        # Pin the version (no "latest") and cryptographically verify the download
        # against its upstream Sigstore signature before running it. The binary runs
        # with the registry publishing (OIDC) token, so an unverified/moving artifact
        # would be a token-exfiltration path. We verify the keyless signature was
        # produced by modelcontextprotocol/registry's own release.yml workflow at the
        # pinned tag (Fulcio identity + GitHub OIDC issuer), which proves provenance
        # rather than just matching a self-derived hash -- and needs no per-version
        # checksum maintenance. cosign exits non-zero (job fails closed) on any
        # mismatch. To upgrade, bump MCP_PUBLISHER_VERSION only.
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
          MCP_PUBLISHER_ASSET: mcp-publisher_linux_amd64.tar.gz
        run: |
          set -euo pipefail
          base="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl -fsSL -o "$MCP_PUBLISHER_ASSET" "${base}/${MCP_PUBLISHER_ASSET}"
          curl -fsSL -o "${MCP_PUBLISHER_ASSET}.sigstore.json" "${base}/${MCP_PUBLISHER_ASSET}.sigstore.json"
          cosign verify-blob \
            --bundle "${MCP_PUBLISHER_ASSET}.sigstore.json" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            "$MCP_PUBLISHER_ASSET"
          tar xzf "$MCP_PUBLISHER_ASSET" mcp-publisher

      - name: Login to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish

      - name: Notify completion
        if: success()
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "MCP Registry updated successfully for version $VERSION"
          echo "Docker image: docker.io/couchbase/mcp-server:$VERSION"
          echo "PyPI package: couchbase-mcp-server==$VERSION"