name: OI Integration Tests

# Runs tests/integration/operational_insights against a live Operational
# Insights cluster (steps 2-5 of the quick-install guide:
# https://docs.couchbase.com/enterprise-analytics/current/intro/do-a-quick-install.html).
# Steps 2-3 (booting the containers) happen in "Start OI containers" below;
# steps 4-5 (blob storage config + clusterInit) are
# scripts/oi_ci_cluster/configure_cluster.sh.
#
# Split into four independent jobs — one per transport x server-binary
# combination that's actually distinct — so each shows up as its own check:
#   - source-stdio: no build step; spawns the server over stdio from checkout.
#   - source-http:  no build step; runs the server as a background http
#                   process from checkout.
#   - docker:       builds the Docker image, runs the server as a container, http only.
#   - pypi:         builds the wheel, installs it into a venv, runs the
#                   installed console script, http only.
# (docker/pypi are http-only because there is nothing distinct to build for
# stdio — it always runs from source.)
# There is no cb_version axis here (unlike test.yml) — only one Operational
# Insights image is pinned.
on:
  pull_request:
    branches: [main, multi_package]

# One in-flight run per branch. Each run stands up four Operational Insights
# clusters (one per job) plus an S3Mock sidecar each, and the docker job also
# builds the image — so a superseded run is expensive to leave going.
# Pull-request only, so an unconditional cancel is correct here; test.yml
# guards its `main` pushes instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # Source - stdio, straight from checkout (the original, pre-matrix behavior)
  # ============================================
  oi-integration-tests-source-stdio:
    name: OI integration tests (source, stdio)
    runs-on: ubuntu-latest
    env:
      # docker-compose.yml's ${VAR} references (steps 2-3).
      OI_IMAGE: couchbase/enterprise-analytics:2.2.1
      S3MOCK_IMAGE: adobe/s3mock:5.2.3
      S3MOCK_BUCKET: cloud-storage-container
      S3MOCK_STORE_ROOT: fs
      S3MOCK_RETAIN_FILES_ON_EXIT: "true"
      OI_ADMIN_PORT: 8091
      OI_ANALYTICS_PORT: 8095
      # configure_cluster.sh's blob storage settings (step 4).
      BLOB_STORAGE_SCHEME: s3
      BLOB_STORAGE_REGION: us-east-1
      BLOB_STORAGE_ENDPOINT: http://s3mock:9090
      BLOB_STORAGE_ANONYMOUS_AUTH: "true"
      BLOB_STORAGE_PATH_STYLE_ADDRESSING: "true"
      NUM_STORAGE_PARTITIONS: 16
      # configure_cluster.sh's clusterInit settings (step 5).
      CLUSTER_USERNAME: Administrator
      CLUSTER_PASSWORD: password
      CLUSTER_MEMORY_QUOTA: 100
      CLUSTER_NAME: OI CI Cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start OI containers
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml up -d --wait

      - name: Configure OI cluster
        run: ./scripts/oi_ci_cluster/configure_cluster.sh

      - name: Run STDIO OI integration tests
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_TRANSPORT: stdio
          PYTHONPATH: src
        run: |
          echo "Running OI tests with STDIO transport..."
          uv run pytest tests/integration/operational_insights -v --tb=short

      - name: Tear down OI containers
        if: always()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml down -v

  # ============================================
  # Source - http, straight from checkout, own cluster (no build step)
  # ============================================
  oi-integration-tests-source-http:
    name: OI integration tests (source, http)
    runs-on: ubuntu-latest
    env:
      OI_IMAGE: couchbase/enterprise-analytics:2.2.1
      S3MOCK_IMAGE: adobe/s3mock:5.2.3
      S3MOCK_BUCKET: cloud-storage-container
      S3MOCK_STORE_ROOT: fs
      S3MOCK_RETAIN_FILES_ON_EXIT: "true"
      OI_ADMIN_PORT: 8091
      OI_ANALYTICS_PORT: 8095
      BLOB_STORAGE_SCHEME: s3
      BLOB_STORAGE_REGION: us-east-1
      BLOB_STORAGE_ENDPOINT: http://s3mock:9090
      BLOB_STORAGE_ANONYMOUS_AUTH: "true"
      BLOB_STORAGE_PATH_STYLE_ADDRESSING: "true"
      NUM_STORAGE_PARTITIONS: 16
      CLUSTER_USERNAME: Administrator
      CLUSTER_PASSWORD: password
      CLUSTER_MEMORY_QUOTA: 100
      CLUSTER_NAME: OI CI Cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start OI containers
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml up -d --wait

      - name: Configure OI cluster
        run: ./scripts/oi_ci_cluster/configure_cluster.sh

      - name: Start MCP server (HTTP, source)
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_PORT: 8001
          CB_MCP_READ_ONLY_MODE: "false"
          PYTHONPATH: src
        run: |
          echo "Starting Operational Insights MCP server (source) with HTTP transport..."
          CB_OI_CONNECTION_STRING=$CB_OI_CONNECTION_STRING \
          CB_OI_USERNAME=$CB_OI_USERNAME \
          CB_OI_PASSWORD=$CB_OI_PASSWORD \
          CB_MCP_TRANSPORT=http \
          CB_MCP_HOST=127.0.0.1 \
          CB_MCP_PORT=$CB_MCP_PORT \
          CB_MCP_READ_ONLY_MODE=$CB_MCP_READ_ONLY_MODE \
          PYTHONPATH=$PYTHONPATH \
            uv run python -m mcp_server operational-insights &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for HTTP server to be ready..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/mcp 2>/dev/null || echo "000")
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "HTTP server is ready (HTTP $code after ${i}s)"
              break
            fi
            echo "Waiting for HTTP server... ($i/30)"
            sleep 1
          done
          # Uvicorn can accept connections before FastMCP's session manager
          # finishes initializing — give it a moment to fully settle.
          sleep 3

      - name: Run HTTP OI integration tests
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_TRANSPORT: http
          MCP_SERVER_URL: http://127.0.0.1:8001/mcp
          PYTHONPATH: src
        run: |
          echo "Running OI tests with HTTP transport (source)..."
          uv run pytest tests/integration/operational_insights -v --tb=short

      - name: Stop HTTP server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Tear down OI containers
        if: always()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml down -v

  # ============================================
  # Docker - build the image, run it as a container, http only
  # ============================================
  oi-integration-tests-docker:
    name: OI integration tests (docker)
    runs-on: ubuntu-latest
    env:
      OI_IMAGE: couchbase/enterprise-analytics:2.2.1
      S3MOCK_IMAGE: adobe/s3mock:5.2.3
      S3MOCK_BUCKET: cloud-storage-container
      S3MOCK_STORE_ROOT: fs
      S3MOCK_RETAIN_FILES_ON_EXIT: "true"
      OI_ADMIN_PORT: 8091
      OI_ANALYTICS_PORT: 8095
      BLOB_STORAGE_SCHEME: s3
      BLOB_STORAGE_REGION: us-east-1
      BLOB_STORAGE_ENDPOINT: http://s3mock:9090
      BLOB_STORAGE_ANONYMOUS_AUTH: "true"
      BLOB_STORAGE_PATH_STYLE_ADDRESSING: "true"
      NUM_STORAGE_PARTITIONS: 16
      CLUSTER_USERNAME: Administrator
      CLUSTER_PASSWORD: password
      CLUSTER_MEMORY_QUOTA: 100
      CLUSTER_NAME: OI CI Cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start OI containers
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml up -d --wait

      - name: Configure OI cluster
        run: ./scripts/oi_ci_cluster/configure_cluster.sh

      - name: Build Docker image
        run: docker build -t mcp-server-test:latest .

      - name: Start MCP server (HTTP, docker)
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_PORT: 8001
          CB_MCP_READ_ONLY_MODE: "false"
        run: |
          echo "Starting Operational Insights MCP server (docker) with HTTP transport..."
          docker run -d --network host \
            --name mcp-server-oi-http \
            -e CB_OI_CONNECTION_STRING=$CB_OI_CONNECTION_STRING \
            -e CB_OI_USERNAME=$CB_OI_USERNAME \
            -e CB_OI_PASSWORD=$CB_OI_PASSWORD \
            -e CB_MCP_TRANSPORT=http \
            -e CB_MCP_HOST=0.0.0.0 \
            -e CB_MCP_PORT=$CB_MCP_PORT \
            -e CB_MCP_READ_ONLY_MODE=$CB_MCP_READ_ONLY_MODE \
            mcp-server-test:latest operational-insights

          echo "Waiting for HTTP server to be ready..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/mcp 2>/dev/null || echo "000")
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "HTTP server is ready (HTTP $code after ${i}s)"
              break
            fi
            echo "Waiting for HTTP server... ($i/30)"
            sleep 1
          done
          sleep 3

      - name: Run HTTP OI integration tests
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_TRANSPORT: http
          MCP_SERVER_URL: http://127.0.0.1:8001/mcp
          PYTHONPATH: src
        run: |
          echo "Running OI tests with HTTP transport (docker)..."
          uv run pytest tests/integration/operational_insights -v --tb=short

      - name: Stop HTTP server
        if: always()
        run: docker rm -f mcp-server-oi-http 2>/dev/null || true

      - name: Tear down OI containers
        if: always()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml down -v

  # ============================================
  # PyPI - build the wheel, install it, run the installed console script, http only
  # ============================================
  oi-integration-tests-pypi:
    name: OI integration tests (pypi)
    runs-on: ubuntu-latest
    env:
      OI_IMAGE: couchbase/enterprise-analytics:2.2.1
      S3MOCK_IMAGE: adobe/s3mock:5.2.3
      S3MOCK_BUCKET: cloud-storage-container
      S3MOCK_STORE_ROOT: fs
      S3MOCK_RETAIN_FILES_ON_EXIT: "true"
      OI_ADMIN_PORT: 8091
      OI_ANALYTICS_PORT: 8095
      BLOB_STORAGE_SCHEME: s3
      BLOB_STORAGE_REGION: us-east-1
      BLOB_STORAGE_ENDPOINT: http://s3mock:9090
      BLOB_STORAGE_ANONYMOUS_AUTH: "true"
      BLOB_STORAGE_PATH_STYLE_ADDRESSING: "true"
      NUM_STORAGE_PARTITIONS: 16
      CLUSTER_USERNAME: Administrator
      CLUSTER_PASSWORD: password
      CLUSTER_MEMORY_QUOTA: 100
      CLUSTER_NAME: OI CI Cluster
    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          version: "latest"

      - name: Set up Python (latest)
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Start OI containers
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml up -d --wait

      - name: Configure OI cluster
        run: ./scripts/oi_ci_cluster/configure_cluster.sh

      - name: Build and install PyPI wheel
        run: |
          uv build
          python3 -m venv /tmp/pypi-test-venv
          /tmp/pypi-test-venv/bin/pip install --quiet dist/couchbase_mcp_server-*.whl

      - name: Start MCP server (HTTP, pypi)
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_PORT: 8001
          CB_MCP_READ_ONLY_MODE: "false"
        run: |
          echo "Starting Operational Insights MCP server (pypi) with HTTP transport..."
          CB_OI_CONNECTION_STRING=$CB_OI_CONNECTION_STRING \
          CB_OI_USERNAME=$CB_OI_USERNAME \
          CB_OI_PASSWORD=$CB_OI_PASSWORD \
          CB_MCP_TRANSPORT=http \
          CB_MCP_HOST=127.0.0.1 \
          CB_MCP_PORT=$CB_MCP_PORT \
          CB_MCP_READ_ONLY_MODE=$CB_MCP_READ_ONLY_MODE \
            /tmp/pypi-test-venv/bin/couchbase-mcp-server operational-insights &
          echo "SERVER_PID=$!" >> $GITHUB_ENV

          echo "Waiting for HTTP server to be ready..."
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:8001/mcp 2>/dev/null || echo "000")
            if [[ -n "$code" && "$code" != "000" ]]; then
              echo "HTTP server is ready (HTTP $code after ${i}s)"
              break
            fi
            echo "Waiting for HTTP server... ($i/30)"
            sleep 1
          done
          sleep 3

      - name: Run HTTP OI integration tests
        env:
          CB_OI_CONNECTION_STRING: http://127.0.0.1:8095
          CB_OI_USERNAME: ${{ env.CLUSTER_USERNAME }}
          CB_OI_PASSWORD: ${{ env.CLUSTER_PASSWORD }}
          CB_MCP_TRANSPORT: http
          MCP_SERVER_URL: http://127.0.0.1:8001/mcp
          PYTHONPATH: src
        run: |
          echo "Running OI tests with HTTP transport (pypi)..."
          uv run pytest tests/integration/operational_insights -v --tb=short

      - name: Stop HTTP server
        if: always()
        run: |
          if [ -n "${SERVER_PID:-}" ]; then
            kill $SERVER_PID 2>/dev/null || true
          fi

      - name: Tear down OI containers
        if: always()
        run: docker compose -f scripts/oi_ci_cluster/docker-compose.yml down -v
