[project]
name = "enterprise-analytics-mcp-server-tasks"
version = "0.1.0"
description = "MCP server for Couchbase Enterprise Analytics using MCP-protocol Tasks over a blocking SDK query"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # fastmcp[tasks] pulls in `docket`, the task backend. Default backend is
    # memory:// (single process, no Redis). Set FASTMCP_DOCKET_URL=redis://...
    # to coordinate tasks across multiple replicas.
    "fastmcp[tasks]>=2.0.0",
    "click>=8.1.0",
    "couchbase-analytics>=1.1.0",
]

[project.scripts]
enterprise-analytics-mcp-server-tasks = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_mcp", "src/providers"]
force-include = { "src/mcp_server.py" = "mcp_server.py" }
