[project]
name = "enterprise-analytics-mcp-server-rest"
version = "0.1.0"
description = "Stateless MCP server for Couchbase Enterprise Analytics via the Server Async Request REST API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "click>=8.1.0",
    "httpx>=0.27.0",
]

[project.scripts]
enterprise-analytics-mcp-server-rest = "mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_mcp"]
# mcp_server.py is a top-level module (the console-script entrypoint imports it
# as `mcp_server`). Ship it alongside the package so it's importable after
# install, not just when running from inside src/.
force-include = { "src/mcp_server.py" = "mcp_server.py" }
