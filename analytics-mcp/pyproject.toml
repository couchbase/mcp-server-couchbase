[project]
name = "couchbase-analytics-mcp-server"
version = "0.1.0"
description = "Throwaway prototype MCP server for Couchbase Enterprise Analytics (EA) tools. Not for production use."
readme = "README.md"
requires-python = ">=3.10,<3.15"

dependencies = [
    "click>=8.2.1,<9.0.0",
    # >=1.1.0 for the Server Async Request API (cluster.start_query and the
    # QueryHandle/QueryResultHandle surface used by the async query tools).
    "couchbase-analytics>=1.1.0,<2.0.0",
    "fastmcp>=3.2.0,<4.0.0",
]

[project.scripts]
ea-mcp-server = "ea_mcp_server:main"

[project.optional-dependencies]
dev = [
    "ruff==0.16.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
]

[tool.ruff]
line-length = 88
target-version = "py310"
include = ["src/**/*.py", "tests/**/*.py", "*.py"]

[tool.ruff.lint]
select = ["E", "W", "F", "UP", "B", "SIM", "I", "N", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["N802"]
"conftest.py" = []

[tool.ruff.lint.isort]
known-first-party = ["ea_mcp"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["tests"]
markers = [
    "integration: Integration tests against a live Enterprise Analytics cluster via the MCP server.",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ea_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"src/ea_mcp_server.py" = "ea_mcp_server.py"

[tool.uv]
package = true
